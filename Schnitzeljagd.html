<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zürich-Schnitzeljagd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-screen game. Sticky status bar (Posten-Fortschritt + Münzen), darunter eine Bühne,
   die je nach Phase Karte, Frage oder Auswertung zeigt. Farben: Zürcher Blau/Weiss + Münzgold. */
:root{
  --bg:#EAF1F8; --surface:#FFFFFF; --surface-2:#F4F8FC; --ink:#11233A; --muted:#566A82; --line:#D3DEEA;
  --blue:#0A5CAD; --blue-ink:#FFFFFF; --blue-soft:#DCEAF8;
  --gold:#E9A514; --gold-deep:#9A6600; --gold-soft:#FFF1CF;
  --good:#1D8A4C; --good-soft:#DDF3E5; --bad:#C2372C; --bad-soft:#FBE3E0;
  --land:#EEF2E6; --water:#A7CDEE; --water-line:#7DB1DD; --forest:#CFE0BE; --forest-line:#B5CDA0;
  --rail:#6D7A8A; --map-text:#46586D; --halo:#EEF2E6;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1622; --surface:#162233; --surface-2:#1B2A3D; --ink:#E6EEF7; --muted:#9DB0C5; --line:#2A3B51;
  --blue:#5AA5F0; --blue-ink:#071423; --blue-soft:#1C3350;
  --gold:#F4B634; --gold-deep:#F7C964; --gold-soft:#3A2F14;
  --good:#45C07C; --good-soft:#163B28; --bad:#F2766A; --bad-soft:#43201D;
  --land:#1A2631; --water:#1E4A72; --water-line:#2D6797; --forest:#1F3626; --forest-line:#2A4A33;
  --rail:#8796A8; --map-text:#A7B7C8; --halo:#1A2631; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1622; --surface:#162233; --surface-2:#1B2A3D; --ink:#E6EEF7; --muted:#9DB0C5; --line:#2A3B51;
  --blue:#5AA5F0; --blue-ink:#071423; --blue-soft:#1C3350;
  --gold:#F4B634; --gold-deep:#F7C964; --gold-soft:#3A2F14;
  --good:#45C07C; --good-soft:#163B28; --bad:#F2766A; --bad-soft:#43201D;
  --land:#1A2631; --water:#1E4A72; --water-line:#2D6797; --forest:#1F3626; --forest-line:#2A4A33;
  --rail:#8796A8; --map-text:#A7B7C8; --halo:#1A2631; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

.app{height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
@media (max-width:560px){ .brand b{display:none} .task h2{font-size:22px} .clue,.hintbox{font-size:15px} .task{padding:12px;gap:6px} .find{gap:10px} }
.dots{display:flex;gap:5px;margin-left:auto;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--blue)}
.dot.now{background:var(--surface);box-shadow:0 0 0 2px var(--blue)}
.coins{position:relative;display:flex;align-items:center;gap:6px;background:var(--gold-soft);border-radius:999px;padding:4px 12px 4px 5px;font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.delta{position:absolute;right:6px;top:-4px;font-weight:800;font-size:15px;pointer-events:none;animation:float 1.3s ease-out forwards}
.delta.plus{color:var(--good)} .delta.minus{color:var(--bad)}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.confirm{max-width:1080px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.confirm span{margin-right:auto}

.stage{flex:1;min-height:0;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage-in{max-width:1080px;margin:0 auto;height:100%}
.scroll{overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:16px;cursor:pointer;background:var(--blue);color:var(--blue-ink);min-height:48px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.tip{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.btn.tip small{font-weight:700;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.coin{width:22px;height:22px;flex:none}

/* Start */
.start{display:grid;gap:14px;max-width:720px;margin:0 auto;padding-bottom:20px}
.hero{display:grid;gap:12px;padding:22px}
.hero h1{font-size:clamp(30px,7vw,44px);font-weight:700;color:var(--blue)}
.hero p{font-size:17px;max-width:58ch}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rule{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.rule b{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.rule span{font-size:14px;color:var(--muted)}
.rule.plus b{color:var(--good)} .rule.minus b{color:var(--bad)} .rule.gold b{color:var(--gold-deep)}
.howto-list{margin:0;padding-left:20px;display:grid;gap:4px}
.start-actions{display:flex;flex-wrap:wrap;gap:10px}

/* Find */
.find{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}
.task{display:grid;gap:8px;padding:14px}
.task h2{font-size:26px}
.clue{font-size:16px}
.hintbox{background:var(--gold-soft);border-radius:10px;padding:8px 10px;font-size:15px}
.task-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small{font-size:13px;color:var(--muted)}
.found-badge{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:800}
@media (min-width:860px){
  .find{grid-template-rows:none;grid-template-columns:340px minmax(0,1fr)}
  .task{align-content:start}
}

/* Map */
.mapslot{position:relative;min-height:0;height:100%}
.map{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--land)}
.map svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map svg:active{cursor:grabbing}
.land{fill:var(--land)} .lake{fill:var(--water);stroke:var(--water-line);stroke-width:1.2}
.river{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.forest{fill:var(--forest);stroke:var(--forest-line);stroke-width:1}
.contour{fill:none;stroke:var(--forest-line);stroke-width:1.2}
.rail{fill:none;stroke:var(--rail);stroke-width:3;stroke-linejoin:round}
.rail-dash{fill:none;stroke:var(--land);stroke-width:1.4;stroke-dasharray:6 6}
.lbl{fill:var(--map-text);font-family:var(--f-body);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
.lbl.water{fill:var(--water-line);font-style:italic;font-weight:700}
.lbl.quarter{text-transform:uppercase;letter-spacing:.12em;font-weight:800;opacity:.7}
.lbl.hill{font-family:var(--f-display);font-weight:600}
.peak{fill:var(--map-text)}
.mk{cursor:pointer}
.mk .hit{fill:transparent}
.mk .dot{fill:var(--surface);stroke:var(--blue);}
.mk:hover .dot,.mk:focus-visible .dot{fill:var(--blue-soft)}
.mk:focus{outline:none}
.mk .num{fill:var(--blue-ink);font-family:var(--f-display);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none;display:none}
.mk .name{fill:var(--ink);font-weight:800;text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none;display:none}
.mk.found .dot{fill:var(--good);stroke:var(--surface)}
.mk.found .num{display:block}
.mk.known .dot{fill:var(--line);stroke:var(--muted)}
.mk.showname .name{display:block}
.mk.here .dot{fill:var(--gold);stroke:var(--surface)}
.mk.here .num{fill:var(--ink)}
.pulse{fill:none;stroke:var(--gold);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.2)}}
.route{fill:none;stroke:var(--good);stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.hintc{fill:var(--gold);fill-opacity:.16;stroke:var(--gold-deep)}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:800;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.compass{position:absolute;left:10px;top:10px;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--bad)}
.compass::before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom:7px solid var(--bad);border-top:0}
.compass span{margin-top:6px}
.scale{position:absolute;left:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.scale .bar{height:6px;border:2px solid var(--ink);border-top:0}
.toast{position:absolute;left:10px;right:62px;bottom:52px;max-height:60%;overflow:auto;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.4;box-shadow:0 6px 20px rgb(0 0 0 / .12)}
.toast.ok{border-left-color:var(--good)}
.toast.info{border-left-color:var(--blue)}

/* Quiz */
.quiz{max-width:760px;margin:0 auto;display:grid;gap:14px;padding:18px}
.quiz h2{font-size:24px}
.q{font-size:20px;font-weight:700;line-height:1.4}
.opts{display:grid;gap:10px}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:17px;font-weight:700;cursor:pointer;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--muted);cursor:not-allowed}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.removed{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.feedback{border-radius:12px;padding:10px 12px;font-weight:700}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.good{background:var(--good-soft);color:var(--good)}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fact b{font-family:var(--f-display);font-weight:600;color:var(--blue)}
.next{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.next h3{font-size:22px}

/* End */
.end{max-width:760px;margin:0 auto;display:grid;gap:14px;padding-bottom:24px}
.result{display:grid;gap:12px;text-align:center;padding:22px}
.total{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:56px;font-weight:700;color:var(--gold-deep);font-variant-numeric:tabular-nums;line-height:1}
.total .coin{width:48px;height:48px}
.rank{font-size:24px;color:var(--blue)}
.calc{width:100%;max-width:420px;margin:0 auto;border-collapse:collapse;font-variant-numeric:tabular-nums;text-align:left}
.calc td{padding:6px 4px;border-bottom:1px solid var(--line)}
.calc td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.calc tr.sum td{border-bottom:0;border-top:2px solid var(--ink);font-size:18px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.routecard{display:grid;gap:10px}
.routecard .mapslot{height:340px}
.learned ol{margin:0;padding-left:22px;display:grid;gap:10px}
.learned li b{font-family:var(--f-display);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ============ Spielregeln (hier anpassbar) ============ */
const START_COINS = 50;   // Startkapital
const RIGHT_COINS = 10;   // pro richtige Antwort
const WRONG_COST  = 5;    // pro falsche Antwort
const TIP_COST    = 15;   // pro Tipp

/* ============ Posten (Reihenfolge = Route) ============ */
const POSTEN = [
 {id:'hb', name:'Hauptbahnhof', lon:8.5402, lat:47.3779,
  clue:'Der grösste Bahnhof der Schweiz. Suche dort, wo die Bahnlinie aus dem Westen endet – ganz nahe an der Limmat.',
  mapTip:'Der Hauptbahnhof liegt am Westufer der Limmat, ein kleines Stück südlich der Stelle, wo die Sihl in die Limmat fliesst.',
  arrive:'Hier kommen jeden Tag Hunderttausende Menschen mit dem Zug an.',
  q:'Die erste Eisenbahn, die ganz in der Schweiz fuhr, verband Zürich mit Baden. In welchem Jahr fuhr sie zum ersten Mal?',

  fact:'1847 fuhr der erste Zug von Zürich nach Baden. Man nennt die Strecke «Spanisch-Brötli-Bahn», weil damit ein feines Gebäck aus Baden, das Spanisch Brötli, frisch nach Zürich kam.'},
 {id:'lindenhof', name:'Lindenhof', lon:8.5409, lat:47.3729,

 {id:'fraumuenster', name:'Fraumünster', lon:8.5413, lat:47.3697,
  clue:'Eine Kirche mit einem schlanken, spitzen Turm. Sie steht am Westufer der Limmat, zwischen dem Lindenhof und dem See.',
  mapTip:'Vom Lindenhof aus nur ein paar hundert Meter Richtung See – direkt an der Limmat.',

 {id:'sechselaeuten', name:'Sechseläutenplatz', lon:8.5475, lat:47.3657,

let shownCoins=null;
function renderHeader(){
  const dots=$('#dots'), coins=$('#coins');
  if(!state){dots.innerHTML='';coins.hidden=true;$('#restartBtn').hidden=true;shownCoins=null;return;}
  coins.hidden=false; $('#restartBtn').hidden=state.phase==='end';
  dots.innerHTML=POSTEN.map((p,i)=>{
    const done=state.found.includes(i)&&(i<state.idx||state.phase==='solved'||state.phase==='end');
    const now=i===state.idx&&state.phase!=='end'&&!done;
    return `<span class="dot ${done?'done':''} ${now?'now':''}" title="Posten ${i+1}"></span>`;}).join('');
  dots.setAttribute('aria-label',`Posten ${Math.min(state.idx+1,10)} von 10`);
  $('#coinNum').textContent=state.coins;
  if(shownCoins!==null && shownCoins!==state.coins){
    const d=state.coins-shownCoins, el=document.createElement('span');
    el.className='delta '+(d>0?'plus':'minus'); el.textContent=(d>0?'+':'−')+Math.abs(d);
    coins.appendChild(el); setTimeout(()=>el.remove(),1400);
  }
  shownCoins=state.coins;
}

/* ============ Pan / Zoom ============ */
const MINW=55, MAXW=W;
const ptrs=new Map(); let gest={dragged:false,sx:0,sy:0};
function toSvg(cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:view.x+view.w/2,y:view.y+view.h/2};}
function clampView(){
  const cx=Math.min(Math.max(view.x+view.w/2,0),W), cy=Math.min(Math.max(view.y+view.h/2,0),H);
  view.x=cx-view.w/2; view.y=cy-view.h/2;
}
function zoomAround(f,c){
  const nw=Math.min(Math.max(view.w/f,MINW),MAXW), r=nw/view.w;
  view.x=c.x-(c.x-view.x)*r; view.y=c.y-(c.y-view.y)*r; view.w=nw; view.h=nw*H/W;
  clampView(); applyView();
}
function zoomTo(cx,cy,w){ view.w=Math.min(Math.max(w,MINW),MAXW); view.h=view.w*H/W; view.x=cx-view.w/2; view.y=cy-view.h/2; clampView(); applyView(); }
function fitMap(){ view={x:0,y:0,w:W,h:H}; applyView(); }
function bindGestures(){
  svg.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1) gest={dragged:false,sx:e.clientX,sy:e.clientY};
  });
  window.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)) return;
    const prev=ptrs.get(e.pointerId), cur={x:e.clientX,y:e.clientY};
    if(ptrs.size===1){
      if(Math.hypot(cur.x-gest.sx,cur.y-gest.sy)>6) gest.dragged=true;
      if(gest.dragged){ view.x-=(cur.x-prev.x)/scale; view.y-=(cur.y-prev.y)/scale; clampView(); applyView(); }
    } else if(ptrs.size===2){
      gest.dragged=true;
      const other=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
      const d0=Math.hypot(prev.x-other.x,prev.y-other.y), d1=Math.hypot(cur.x-other.x,cur.y-other.y);
      const m0={x:(prev.x+other.x)/2,y:(prev.y+other.y)/2}, m1={x:(cur.x+other.x)/2,y:(cur.y+other.y)/2};
      view.x-=(m1.x-m0.x)/scale; view.y-=(m1.y-m0.y)/scale;
      if(d0>0) zoomAround(d1/d0,toSvg(m1.x,m1.y)); else applyView();
    }
    ptrs.set(e.pointerId,cur);
  });
  const up=e=>{ptrs.delete(e.pointerId);};
  window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAround(Math.exp(-e.deltaY*0.0018),toSvg(e.clientX,e.clientY));},{passive:false});
}
function applyView(){
  if(!svg) return;
  svg.setAttribute('viewBox',`${f1(view.x)} ${f1(view.y)} ${f1(view.w)} ${f1(view.h)}`);
  const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return;
  scale=Math.min(r.width/view.w,r.height/view.h);
  const u=px=>px/scale;
  svg.querySelectorAll('[data-fs]').forEach(t=>{t.setAttribute('font-size',f1(u(+t.dataset.fs)));t.style.strokeWidth=u(3);});
  const showNames=scale>=1.35;
  Object.values(markerEls).forEach(({g,pt})=>{
    const big=g.classList.contains('found')||g.classList.contains('here');
    g.querySelector('.hit').setAttribute('r',u(19));
    g.querySelector('.dot').setAttribute('r',u(big?11:7.5));
    g.querySelector('.dot').setAttribute('stroke-width',u(2.5));
    g.querySelector('.pulse').setAttribute('r',u(14)); g.querySelector('.pulse').setAttribute('stroke-width',u(3));
    const num=g.querySelector('.num'); num.setAttribute('font-size',u(12));
    const nm=g.querySelector('.name'); nm.setAttribute('font-size',u(12.5)); nm.setAttribute('y',u(big?-16:-12)); nm.style.strokeWidth=u(3.5);
    const named=g.classList.contains('found')||g.classList.contains('known');
    g.classList.toggle('showname',named&&(showNames||g.classList.contains('here')));
  });
  const route=svg.querySelector('#route'); route.setAttribute('stroke-width',u(3)); route.setAttribute('stroke-dasharray',`${u(6)} ${u(6)}`);
  svg.querySelectorAll('.hintc').forEach(c=>{c.setAttribute('stroke-width',u(2));c.setAttribute('stroke-dasharray',`${u(7)} ${u(5)}`);});
  // Massstab
  const mpp=10/scale, nice=[50,100,200,500,1000,2000,5000];
  let m=nice.find(n=>n/mpp>=55)||5000;
  $('#scaleBar')&&( $('#scaleBar').style.width=Math.round(m/mpp)+'px' );
  $('#scaleTxt')&&( $('#scaleTxt').textContent=m>=1000?(m/1000)+' km':m+' m' );
}
function refreshMarkers(){
  if(!svg) return;
  Object.values(markerEls).forEach(({g,pt})=>{
    g.classList.remove('found','known','here');
    const pulse=g.querySelector('.pulse'); pulse.style.display='none';
    if(pt.kind==='p'){
      const pos=state.found.indexOf(pt.i);
      if(pos>-1){
        g.classList.add('found'); g.querySelector('.num').textContent=pt.i+1;
        if(state.phase==='arrived'&&pt.i===state.idx){g.classList.add('here');pulse.style.display='';}
        g.setAttribute('aria-label',`Posten ${pt.i+1}: ${pt.name}`);
      } else g.setAttribute('aria-label','Ort auf der Karte');
    } else if(state.known.includes(pt.id)){ g.classList.add('known'); g.setAttribute('aria-label',pt.name); }
  });
  const order=state.found.slice().sort((a,b)=>a-b);
  svg.querySelector('#route').setAttribute('points',order.map(i=>P(POSTEN[i].lon,POSTEN[i].lat).map(f1).join(',')).join(' '));
  const hg=svg.querySelector('#hintG'); hg.innerHTML='';
  if(state.phase==='find'&&state.mapTip[state.idx]){
    const c=hintCenter(state.idx);
    hg.innerHTML=`<circle class="hintc" cx="${f1(c.x)}" cy="${f1(c.y)}" r="45"/>`;
  }
  applyView();
}
function hintCenter(i){const [x,y]=P(POSTEN[i].lon,POSTEN[i].lat),o=state.hintOff[i];return {x:x+o[0],y:y+o[1]};}

function hideToast(){ if(mapEl){mapEl.querySelector('#toast').hidden=true;} }

/* ============ Richtung + Distanz ============ */
function bearing(from,toIdx){
  const [fx,fy]=P(from.lon,from.lat), [tx,ty]=P(POSTEN[toIdx].lon,POSTEN[toIdx].lat);
  const dx=tx-fx, dy=ty-fy, ang=Math.atan2(-dy,dx)*180/Math.PI;
  const dirs=['Osten','Nordosten','Norden','Nordwesten','Westen','Südwesten','Süden','Südosten'];
  const dir=dirs[((Math.round(ang/45)%8)+8)%8];
  const m=Math.hypot(dx,dy)*10;
  const dist=m<1000?`etwa ${Math.max(50,Math.round(m/50)*50)} m`:`etwa ${(m/1000).toFixed(1).replace('.',',')} km`;
  return `${dist} Richtung <b>${dir}</b>`;
}

/* ============ Spielaktionen ============ */
function pick(pt){
  if(!state||state.phase!=='find') return;
  const target=POSTEN[state.idx];
  if(pt.kind==='p'&&pt.i===state.idx){
    state.found.push(state.idx); state.phase='arrived'; hideToast(); save(); render(); return;
  }
  const dirTxt=`Der Posten «${esc(target.name)}» liegt von hier ${bearing(pt,state.idx)}.`;
  if(pt.kind==='p'&&state.found.includes(pt.i)){
    showToast(`Hier warst du schon: <b>${esc(pt.name)}</b>. ${dirTxt}`,'info');
  } else if(pt.kind==='p'){
    state.stats.misses++;
    showToast(`<b>Nicht ganz.</b> Das ist ein anderer Posten – den suchst du später. ${dirTxt}`);
  } else {
    state.stats.misses++;
    if(!state.known.includes(pt.id)) state.known.push(pt.id);
    showToast(`<b>Nicht ganz.</b> ${esc(pt.text)} ${dirTxt}`);
  }
  save(); refreshMarkers();
}
function buyMapTip(){
  const i=state.idx; if(state.mapTip[i]||state.coins<TIP_COST) return;
  state.coins-=TIP_COST; state.stats.tips++; state.stats.tipCost+=TIP_COST; state.mapTip[i]=true;
  save(); render(); const c=hintCenter(i); zoomTo(c.x,c.y,170);
}
function showTipArea(){ const c=hintCenter(state.idx); zoomTo(c.x,c.y,170); }
function answer(k){
  const i=state.idx, p=POSTEN[i];
  if(state.phase!=='question'||state.wrongOpts[i].includes(k)||state.removed[i].includes(k)) return;
  if(k===p.a){
    state.coins+=RIGHT_COINS; state.stats.correct++; state.phase='solved';
    ui.feedback={kind:'good',text:`Richtig! +${RIGHT_COINS} Münzen`};
  } else {
    const cost=Math.min(WRONG_COST,state.coins);
    state.coins-=cost; state.stats.wrong++; state.stats.wrongCost+=cost; state.wrongOpts[i].push(k);
    ui.feedback={kind:'bad',text:cost>0?`Leider falsch. −${cost} Münzen. Versuch es nochmals!`:'Leider falsch. Versuch es nochmals!'};
  }
  save(); render();
}
function buyQTip(){
  const i=state.idx, p=POSTEN[i];
  if(state.qTip[i]||state.coins<TIP_COST) return;
  const active=[0,1,2,3].filter(k=>k!==p.a&&!state.wrongOpts[i].includes(k)&&!state.removed[i].includes(k));
  if(!active.length) return;
  state.coins-=TIP_COST; state.stats.tips++; state.stats.tipCost+=TIP_COST; state.qTip[i]=true;
  state.removed[i].push(...shuffle(active).slice(0,2));
  ui.feedback={kind:'good',text:'Tipp gekauft: Falsche Antworten sind weg.'};
  save(); render();
}
function nextPosten(){
  ui.feedback=null; hideToast();
  if(state.idx<POSTEN.length-1){ state.idx++; state.phase='find'; save(); render(); fitMap(); }
  else { state.phase='end'; const best=store.get(BKEY)||0; state.newBest=state.coins>best; if(state.coins>best) store.set(BKEY,state.coins); state.prevBest=best; save(); render(); fitMap(); }
}
function startNew(){ state=newGame(); shownCoins=null; ui={feedback:null}; hideToast(); save(); render(); fitMap(); }

/* ============ Rendern ============ */
function mountMap(slot){
  if(!mapEl) buildMap();
  slot.appendChild(mapEl); refreshMarkers();
}
function render(){
  renderHeader();
  const root=$('#stageIn'), stage=$('#stage');
  stage.classList.remove('scroll');
  if(!state){ renderStart(root); stage.classList.add('scroll'); return; }
  if(state.phase==='find'||state.phase==='arrived') renderFind(root);
  else if(state.phase==='question'||state.phase==='solved'){ renderQuiz(root); stage.classList.add('scroll'); }
  else { renderEnd(root); stage.classList.add('scroll'); }
}
function renderStart(root){
  const saved=store.get(SKEY), best=store.get(BKEY);
  const canResume=saved&&saved.v===1&&saved.phase!=='end';
  root.innerHTML=`
  <section class="start">
    <div class="card hero">
      <p class="eyebrow">Stadtspiel für Entdeckerinnen und Entdecker</p>
      <h1>Zürich-Schnitzeljagd</h1>
      <p>Finde 10 Posten auf der Karte von Zürich und beantworte bei jedem Posten eine Frage. So lernst du die Stadt kennen – vom Hauptbahnhof bis auf den Uetliberg.</p>
      <div class="start-actions">
        ${canResume?`<button class="btn" id="resumeBtn">Weiterspielen (Posten ${Math.min(saved.idx+1,10)}/10 · ${saved.coins} Münzen)</button><button class="btn ghost" id="newBtn">Neues Spiel</button>`:`<button class="btn" id="newBtn">Los geht's</button>`}
      </div>
      ${best?`<p class="small">Dein bester Punktestand bisher: ${best} Münzen</p>`:''}
    </div>
    <div class="card" style="display:grid;gap:12px">
      <h3>Münzen</h3>
      <div class="rules">
        <div class="rule gold"><b>${START_COINS}</b><span>Startkapital</span></div>
        <div class="rule plus"><b>+${RIGHT_COINS}</b><span>pro richtige Antwort</span></div>
        <div class="rule minus"><b>−${WRONG_COST}</b><span>pro falsche Antwort</span></div>
        <div class="rule minus"><b>−${TIP_COST}</b><span>pro Tipp</span></div>
      </div>
    </div>
    <div class="card" style="display:grid;gap:10px">
      <h3>So geht's</h3>
      <ol class="howto-list">
        <li>Die App sagt dir, welchen Ort du suchen musst, und gibt dir einen Hinweis.</li>
        <li>Tippe auf der Karte auf den richtigen Punkt. Liegst du daneben, zeigt dir die App die Richtung.</li>
        <li>Beim Posten beantwortest du eine Frage. Erst wenn sie richtig ist, geht es weiter.</li>
        <li>Steckst du fest? Kaufe einen Tipp – auf der Karte oder bei der Frage.</li>
        <li>Am Schluss siehst du, wie viele Münzen du gesammelt hast.</li>
      </ol>
    </div>
  </section>`;
  if(canResume) $('#resumeBtn').onclick=()=>{state=saved; shownCoins=null; render(); fitMap();};
  $('#newBtn').onclick=startNew;
}
function renderFind(root){
  const i=state.idx, p=POSTEN[i], tipUsed=state.mapTip[i];
  let panel;
  if(state.phase==='find'){
    panel=`
      <p class="eyebrow">Posten ${i+1} von 10 · Finde auf der Karte</p>
      <h2>${esc(p.name)}</h2>
      <p class="clue">${esc(p.clue)}</p>
      ${tipUsed?`<p class="hintbox"><b>Tipp:</b> ${esc(p.mapTip)} Der Posten liegt im gelben Kreis.</p>`:''}
      <div class="task-row">
        ${tipUsed?`<button class="btn ghost" id="tipArea">Tipp-Gebiet zeigen</button>`:
          `<button class="btn tip" id="mapTipBtn" ${state.coins<TIP_COST?'disabled':''}>Tipp kaufen <small>· ${TIP_COST} Münzen</small></button>`}
      </div>
      ${!tipUsed&&state.coins<TIP_COST?`<p class="small">Zu wenig Münzen für einen Tipp.</p>`:''}
      ${i===0?`<p class="small">Tippe auf den richtigen Punkt. Zoomen mit + und − oder mit zwei Fingern, verschieben durch Ziehen.</p>`:''}`;
  } else {
    panel=`
      <p class="found-badge">✓ Gefunden!</p>
      <h2>Posten ${i+1}: ${esc(p.name)}</h2>
      <p class="clue">${esc(p.arrive)}</p>
      <button class="btn block" id="toQuiz">Frage beantworten</button>`;
  }
  root.innerHTML=`<section class="find"><div class="card task">${panel}</div><div class="mapslot" id="mapSlot"></div></section>`;
  mountMap($('#mapSlot'));
  const b=$('#mapTipBtn'); if(b) b.onclick=buyMapTip;
  const ta=$('#tipArea'); if(ta) ta.onclick=showTipArea;
  const tq=$('#toQuiz'); if(tq){ tq.onclick=()=>{state.phase='question';ui.feedback=null;save();render();}; tq.focus({preventScroll:true}); }
}
function renderQuiz(root){
  const i=state.idx, p=POSTEN[i], solved=state.phase==='solved';
  const active=[0,1,2,3].filter(k=>k!==p.a&&!state.wrongOpts[i].includes(k)&&!state.removed[i].includes(k));
  const opts=state.orders[i].map((k,pos)=>{
    const wrong=state.wrongOpts[i].includes(k), rem=state.removed[i].includes(k), right=solved&&k===p.a;
    const cls=wrong?'wrong':rem?'removed':right?'right':'';
    const dis=solved||wrong||rem;
    return `<button class="opt ${cls}" data-k="${k}" ${dis?'disabled':''}><span class="k">${KEYS[pos]}</span><span>${esc(p.opts[k])}</span></button>`;
  }).join('');
  const last=i===POSTEN.length-1;
  const next=solved?(last?`
    <div class="next"><h3>Du hast alle 10 Posten geschafft!</h3><button class="btn block" id="nextBtn">Zur Auswertung</button></div>`:`
    <div class="next"><p class="eyebrow">Dein nächster Posten</p><h3>${esc(POSTEN[i+1].name)}</h3><p class="muted">${esc(POSTEN[i+1].clue)}</p><button class="btn block" id="nextBtn">Auf der Karte suchen</button></div>`):'';
  const tipBtn=!solved?(state.qTip[i]?'':`<div class="task-row"><button class="btn tip" id="qTipBtn" ${(state.coins<TIP_COST||!active.length)?'disabled':''}>Tipp kaufen <small>· ${TIP_COST} Münzen · 2 falsche Antworten verschwinden</small></button></div>${state.coins<TIP_COST?'<p class="small">Zu wenig Münzen für einen Tipp.</p>':''}`):'';
  root.innerHTML=`
  <section class="card quiz">
    <p class="eyebrow">Posten ${i+1} von 10 · Frage</p>
    <h2>${esc(p.name)}</h2>
    <p class="q">${esc(p.q)}</p>
    <div class="opts">${opts}</div>
    ${ui.feedback?`<p class="feedback ${ui.feedback.kind}" role="status">${esc(ui.feedback.text)}</p>`:''}
    ${solved?`<div class="fact"><b>Wusstest du?</b><p>${esc(p.fact)}</p></div>`:''}
    ${tipBtn}
    ${next}
  </section>`;
  root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const qt=$('#qTipBtn'); if(qt) qt.onclick=buyQTip;
  const nb=$('#nextBtn'); if(nb) nb.onclick=nextPosten;
}
function renderEnd(root){
  const s=state.stats, total=state.coins;
  const check=START_COINS+s.correct*RIGHT_COINS-s.wrongCost-s.tipCost;
  const rank=total>=130?['Zürich-Profi!','Du kennst dich in Zürich super aus.']:
             total>=100?['Schlauer Stadtfuchs!','Fast alles richtig – stark.']:
             total>=70?['Gute Entdeckungstour!','Du hast viel Neues über Zürich gelernt.']:
             ['Geschafft!','Beim nächsten Mal sammelst du bestimmt noch mehr Münzen.'];
  root.innerHTML=`
  <section class="end">
    <div class="card result">
      <p class="eyebrow">Schlussabrechnung</p>
      <div class="total">${COIN_SVG}<span>${total}</span></div>
      <p class="muted" style="margin-top:-4px">Münzen total · Maximum ${START_COINS+POSTEN.length*RIGHT_COINS}</p>
      <h2 class="rank">${rank[0]}</h2>
      <p>${rank[1]}</p>
      <table class="calc">
        <tr><td>Startkapital</td><td>${START_COINS}</td></tr>
        <tr><td>${s.correct} richtige Antworten × ${RIGHT_COINS}</td><td class="pos">+${s.correct*RIGHT_COINS}</td></tr>
        <tr><td>${s.wrong} falsche Antworten</td><td class="neg">${s.wrongCost?'−'+s.wrongCost:'0'}</td></tr>
        <tr><td>${s.tips} Tipps × ${TIP_COST}</td><td class="neg">${s.tipCost?'−'+s.tipCost:'0'}</td></tr>
        <tr class="sum"><td>Total</td><td>${check}</td></tr>
      </table>
      <p class="small">Fehlklicks auf der Karte: ${s.misses} (ohne Abzug)${state.newBest?' · Neuer Bestwert!':(state.prevBest?` · Bisheriger Bestwert: ${state.prevBest}`:'')}</p>
      <div class="start-actions" style="justify-content:center"><button class="btn" id="againBtn">Nochmals spielen</button></div>
    </div>
    <div class="card routecard">
      <h3>Deine Route</h3>
      <div class="mapslot" id="mapSlot"></div>
    </div>
    <div class="card learned">
      <h3 style="margin-bottom:10px">Das hast du gelernt</h3>
      <ol>${POSTEN.map(p=>`<li><b>${esc(p.name)}:</b> ${esc(p.fact)}</li>`).join('')}</ol>
    </div>
  </section>`;
  mountMap($('#mapSlot'));
  $('#againBtn').onclick=startNew;
}

/* ============ Neustart-Bestätigung ============ */
$('#restartBtn').onclick=()=>{$('#confirmBar').hidden=false;};
$('#confirmNo').onclick=()=>{$('#confirmBar').hidden=true;};
$('#confirmYes').onclick=()=>{$('#confirmBar').hidden=true; store.del(SKEY); state=null; render();};

/* ============ Start ============ */
function boot(data){
  if(data&&data.state&&data.state.v===1){ state=data.state; }
  render(); if(state) requestAnimationFrame(fitMap);
}
try{ window.claude?.hot?.snapshot?.(()=>({state})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body></html>
